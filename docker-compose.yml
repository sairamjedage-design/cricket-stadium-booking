version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cricket_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cricket_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricket_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cricket_stadium_booking}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-cricket_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cricket_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cricket_user}:${POSTGRES_PASSWORD:-cricket_pass}@postgres:5432/${POSTGRES_DB:-cricket_stadium_booking}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here}
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: >
      sh -c "prisma generate &&
      prisma migrate deploy &&
      npm run start"

  frontend:
    build: ./frontend
    container_name: cricket_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:5000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

volumes:
  postgres_data: